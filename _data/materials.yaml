# Katalog aller Materialien – jeder Eintrag wird als Karte auf /materialien/ angezeigt.
#
# Felder:
#   title        Name des Materials (Pflicht)
#   subtitle     Zielgruppe, z. B. "Sek I · Klasse 7–8" oder "Lehramtsstudium"
#   category     oer | 3d-druck | spiele | werkzeuge   (bestimmt den Abschnitt)
#   featured     true = zusätzlich auf der Startseite zeigen
#   image        Vorschaubild (3:2), z. B. images/materialien/mein-projekt.jpg
#   link         wohin Bild und Titel verlinken (meist Demo oder Repository)
#   description  1–3 Sätze, Markdown erlaubt
#   license      Schlüssel aus _data/licenses.yaml, z. B. CC-BY-4.0, MIT
#   repo         owner/name auf GitHub – lädt die GitHub-Topics automatisch als Schlagwörter
#   buttons      Liste mit type (source, demo, download, print, printables,
#                worksheet, docs, doi – siehe _data/types.yaml) und link
#   tags         Schlagwörter für Suche und Filter (Themengebiet, Schulstufe, …)
#
# Die Einträge unten sind BEISPIELE. Ersetzen oder löschen, sobald echte Repositories existieren.

- title: Beispiel – Arbeitsblätter Optik
