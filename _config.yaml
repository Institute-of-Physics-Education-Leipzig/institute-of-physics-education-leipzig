# site properties and page defaults
title: Institut für Didaktik der Physik
subtitle: Universität Leipzig
description: Offene Lehr- und Lernmaterialien, 3D-Druck-Dateien, Spiele und Simulationen für den Physikunterricht – frei verfügbar und offen lizenziert.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  # email: physikdidaktik@uni-leipzig.de  # TODO: echte Adresse eintragen
  github: Institute-of-Physics-Education-Leipzig

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - serve.ps1

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
